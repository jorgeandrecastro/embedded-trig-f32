[package]
name = "embedded-trig-f32"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
license = "GPL-2.0-or-later"
description = "sin, cos, tan, cot, sincos, atan, atan2, asin, acos en f32 pour no_std embarqué (avec ou sans FPU)"
repository = "https://github.com/jorgeandrecastro/embedded-trig-f32"
documentation = "https://docs.rs/embedded-trig-f32"
readme = "README.md"
keywords = ["trigonometry", "math", "no-std", "embedded", "f32"]
categories = ["mathematics", "no-std", "embedded"]

[dependencies]
embedded-f32-sqrt = "0.2"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true